name: ci

on: [push, pull_request]

jobs:
  # Owner-only PR gate: skip PRs not authored by the repo owner or coming from forks.
  build:
    if: github.event_name != 'pull_request' || (github.event.pull_request.user.login == github.repository_owner && github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Select isolated repository
        run: echo "CONTEXT_CONTRACT_REPOSITORY=$RUNNER_TEMP/context-contract-m2/$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Library (isolated repository for this revision)
        run: ./mvnw -B clean install -Dmaven.repo.local="$CONTEXT_CONTRACT_REPOSITORY"
      - name: Maven example
        run: ./mvnw -B -f examples/maven/pom.xml clean verify -Dmaven.repo.local="$CONTEXT_CONTRACT_REPOSITORY"
      - name: Gradle Groovy example
        working-directory: examples/gradle-groovy
        run: ./gradlew clean test -PcontextContractRepository="$CONTEXT_CONTRACT_REPOSITORY"
      - name: Gradle Kotlin example
        working-directory: examples/gradle-kotlin
        run: ./gradlew clean test -PcontextContractRepository="$CONTEXT_CONTRACT_REPOSITORY"
      - name: Baseline untouched by the example runs
        run: git diff --exit-code examples/shared/context-baseline.json
      - name: Retain test reports for baseline review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/surefire-reports/**
            examples/maven/target/surefire-reports/**
            examples/gradle-groovy/build/test-results/test/**
            examples/gradle-groovy/build/reports/tests/test/**
            examples/gradle-kotlin/build/test-results/test/**
            examples/gradle-kotlin/build/reports/tests/test/**
  boot3:
    if: github.event_name != 'pull_request' || (github.event.pull_request.user.login == github.repository_owner && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Select isolated repository
        run: echo "CONTEXT_CONTRACT_REPOSITORY=$RUNNER_TEMP/context-contract-m2/$GITHUB_SHA-boot3" >> "$GITHUB_ENV"
      - name: Library (Java 17 bytecode, built with Java 21 against Boot 4)
        run: ./mvnw -B clean install -Dmaven.repo.local="$CONTEXT_CONTRACT_REPOSITORY"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Boot 3.5.16 Maven consumer (Jackson 2 only)
        run: ./mvnw -B -f examples/maven-boot3/pom.xml clean verify -Dmaven.repo.local="$CONTEXT_CONTRACT_REPOSITORY"
      - name: Baselines untouched by consumer runs
        run: git diff --exit-code examples/shared/context-baseline.json examples/maven-boot3/context-baseline.json
      - name: Retain Boot 3 reports for baseline review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-boot3-java17
          if-no-files-found: error
          path: |
            target/surefire-reports/**
            examples/maven-boot3/target/surefire-reports/**
