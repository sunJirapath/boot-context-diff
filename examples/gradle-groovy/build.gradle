plugins {
	id 'java'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenLocal() // the library is installed there by `./mvnw install` in the repository root
	mavenCentral()
}

dependencies {
	implementation platform('org.springframework.boot:spring-boot-dependencies:4.0.8')
	implementation 'org.springframework.boot:spring-boot-starter'
	testImplementation 'io.github.bootcontextdiff:boot-context-diff:0.1.0-SNAPSHOT'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// the fixture is shared with the Maven and Kotlin DSL examples
sourceSets {
	main.java.srcDirs = ['../shared/src/main/java']
	test.java.srcDirs = ['../shared/src/test/java']
}

tasks.named('test') {
	useJUnitPlatform()
	// the example test reads this to decide whether to write the baseline
	environment 'UPDATE_CONTEXT_BASELINE', System.getenv('UPDATE_CONTEXT_BASELINE') ?: ''
}
